<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title id="t">System overview</title>
<desc id="d">CSV input, input contract, SQLite, seven modules and CLI/REST/panel; below, the agent orchestrator that uses the modules as tools.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4e52"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="439" rx="8" fill="#fbfaf6" stroke="#d8d3c7"/>
<text x="24" y="34" font-size="18" font-weight="700" fill="#1b1d1f">Kule Pro + agent orchestrator</text>
<text x="24" y="56" font-size="12.5" fill="#4a4e52">Python standard library only · data is synthetic / public</text>

<g font-size="13" fill="#1b1d1f">
<rect x="20" y="86" width="165" height="104" rx="6" fill="#fff" stroke="#1b1d1f"/>
<text x="32" y="110" font-weight="700">CSV input</text>
<text x="32" y="152" font-size="12" fill="#4a4e52">SAP-style export</text><text x="32" y="168" font-size="12" fill="#4a4e52">(file)</text>

<rect x="210" y="86" width="165" height="104" rx="6" fill="#fff" stroke="#1b1d1f"/>
<text x="222" y="110" font-weight="700">Input contract</text>
<text x="222" y="152" font-size="12" fill="#4a4e52">type, required, duplicates</text><text x="222" y="168" font-size="12" fill="#4a4e52">bad rows are rejected</text>

<rect x="400" y="86" width="165" height="104" rx="6" fill="#fff" stroke="#1b1d1f"/>
<text x="412" y="110" font-weight="700">SQLite</text><text x="412" y="127" fill="#4a4e52">history · cases</text>
<text x="412" y="152" font-size="12" fill="#4a4e52">uploads, snapshots,</text><text x="412" y="168" font-size="12" fill="#4a4e52">cases (audit trail)</text>

<rect x="590" y="86" width="165" height="104" rx="6" fill="#fff" stroke="#1b1d1f"/>
<text x="602" y="110" font-weight="700">7 modules</text><text x="602" y="127" fill="#4a4e52">+ explanation</text>
<text x="602" y="152" font-size="12" fill="#4a4e52">rule-based, no LLM</text>

<rect x="780" y="86" width="160" height="104" rx="6" fill="#fff" stroke="#1b1d1f"/>
<text x="792" y="110" font-weight="700">CLI · REST · Panel</text>
<text x="792" y="152" font-size="12" fill="#4a4e52">token + role matrix</text><text x="792" y="168" font-size="12" fill="#4a4e52">demo setup</text>
</g>
<g stroke="#4a4e52" stroke-width="1.6" marker-end="url(#a)" fill="none">
<path d="M186 138H208"/><path d="M376 138H398"/><path d="M566 138H588"/><path d="M756 138H778"/>
</g>

<g font-size="12" fill="#4a4e52">
<text x="775" y="312" font-weight="700" fill="#1b1d1f">Modules</text>
<text x="775" y="332">Inventory status</text><text x="775" y="348">Order anomaly</text><text x="775" y="364">Demand forecast</text>
<text x="775" y="380">Supplier score</text><text x="775" y="396">Three-way match · OEE</text><text x="775" y="412">FBL1N reconciliation</text>
</g>

<g font-size="13" fill="#1b1d1f">
<rect x="20" y="290" width="735" height="124" rx="6" fill="#f4e4c8" stroke="#8a5200"/>
<text x="34" y="316" font-weight="700">Agent orchestrator</text>
<text x="34" y="334" font-size="12" fill="#4a4e52">state machine, budget, timeout, allow-list, approval gate, trace</text>
<text x="34" y="372" font-size="12.5">Planner → Analyst → Auditor</text>
<text x="34" y="396" font-size="12" fill="#8a5200" font-weight="700">One scenario ran with a real model; other traces are hand-written tapes</text>
</g>
<path d="M672 290V196" stroke="#8a5200" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)" fill="none"/>
<text x="682" y="262" font-size="12" fill="#8a5200">Kule tool layer</text>
<text x="682" y="278" font-size="12" fill="#8a5200">modules become tools</text>
</svg>
