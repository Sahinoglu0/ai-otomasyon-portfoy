<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title id="t">Soruşturma akışı / Investigation flow</title>
<desc id="d">Soru, Planlayıcı, Analist, Denetçi, rapor; Analist yanlış sayı yazarsa Denetçi reddeder ve ikinci denemede doğru sayı kabul edilir. Question, Planner, Analyst, Auditor, report; the Auditor rejects a wrong number and accepts the corrected one on the second attempt.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4e52"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a12a2a"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="419" rx="8" fill="#fbfaf6" stroke="#d8d3c7"/>
<text x="24" y="34" font-size="18" font-weight="700" fill="#1b1d1f">Soruşturma senaryosu · Investigation scenario</text>
<text x="24" y="56" font-size="12.5" fill="#4a4e52">"IZM-01 deposu ve T-03 tedarikçisi neden kritik?" · "Why are warehouse IZM-01 and supplier T-03 critical?"</text>

<g font-size="13" fill="#1b1d1f">
<rect x="20" y="84" width="130" height="86" rx="6" fill="#fff" stroke="#1b1d1f"/>
<text x="32" y="110" font-weight="700">Soru</text><text x="32" y="127" fill="#4a4e52">Question</text>

<rect x="190" y="84" width="170" height="86" rx="6" fill="#fff" stroke="#1b1d1f"/>
<text x="202" y="108" font-weight="700">Planlayıcı · Planner</text>
<text x="202" y="130" font-size="12" fill="#4a4e52">alt görevlere böler</text><text x="202" y="146" font-size="12" fill="#4a4e52">splits into subtasks · no tools</text>

<rect x="400" y="84" width="190" height="86" rx="6" fill="#fff" stroke="#1b1d1f"/>
<text x="412" y="108" font-weight="700">Analist · Analyst</text>
<text x="412" y="130" font-size="12" fill="#4a4e52">stok_sorgu, tedarikci_sorgu</text><text x="412" y="146" font-size="12" fill="#4a4e52">sayıları araçtan alır, iddia yazar</text>

<rect x="630" y="84" width="170" height="86" rx="6" fill="#fff" stroke="#1d6b57" stroke-width="2"/>
<text x="642" y="108" font-weight="700">Denetçi · Auditor</text>
<text x="642" y="130" font-size="12" fill="#4a4e52">KOD, model değil</text><text x="642" y="146" font-size="12" fill="#4a4e52">CODE, not a model</text>

<rect x="830" y="84" width="110" height="86" rx="6" fill="#fff" stroke="#1b1d1f"/>
<text x="842" y="110" font-weight="700">Rapor</text><text x="842" y="127" fill="#4a4e52">Report</text><text x="842" y="148" font-size="11" fill="#4a4e52">+ taslak e-posta</text>
</g>
<g stroke="#4a4e52" stroke-width="1.6" marker-end="url(#a)" fill="none">
<path d="M151 127H188"/><path d="M361 127H398"/><path d="M591 127H628"/><path d="M801 127H828"/>
</g>
<path d="M715 172V215H495V172" stroke="#a12a2a" stroke-width="1.6" fill="none" marker-end="url(#r)"/>
<text x="505" y="208" font-size="12" fill="#a12a2a">reddedildi → en fazla 2 deneme · rejected → at most 2 attempts</text>

<g font-size="13" fill="#1b1d1f">
<rect x="400" y="250" width="215" height="84" rx="6" fill="#f4e4c8" stroke="#8a5200"/>
<text x="412" y="274" font-weight="700">Onay kapısı · Approval gate</text>
<text x="412" y="296" font-size="12" fill="#4a4e52">yan etkili araç onaysız çalışmaz</text><text x="412" y="312" font-size="12" fill="#4a4e52">side-effect tools need approval</text>
<rect x="150" y="250" width="230" height="84" rx="6" fill="#f5dcd9" stroke="#a12a2a"/>
<text x="162" y="274" font-weight="700">İzin listesi · Allow-list</text>
<text x="162" y="296" font-size="12" fill="#4a4e52">listede olmayan araç reddedilir</text><text x="162" y="312" font-size="12" fill="#4a4e52">tools not listed are rejected</text>
<rect x="640" y="250" width="300" height="84" rx="6" fill="#fff" stroke="#1b1d1f"/>
<text x="652" y="274" font-weight="700">Örnek iz · Sample trace</text>
<text x="652" y="296" font-size="12" fill="#a12a2a">Deneme 1: iddia 58.0 ≠ Kule 36.3 → REDDEDİLDİ</text>
<text x="652" y="314" font-size="12" fill="#1d6b57">Attempt 2: claim 36.3 = Kule 36.3 → ACCEPTED</text>
</g>
<path d="M495 172V248" stroke="#8a5200" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/>
<text x="24" y="372" font-size="12.5" fill="#8a5200" font-weight="700">Sınır: Denetçi yalnız ```iddialar``` bloğundaki sayıları denetler; düz metin ve onaylanan içerik denetlenmez (2 bilinen açık).</text>
<text x="24" y="392" font-size="12.5" fill="#8a5200" font-weight="700">Limit: the Auditor only checks numbers in the claims block; plain text and approved content are not checked (2 known gaps).</text>
</svg>
