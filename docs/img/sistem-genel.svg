<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title id="t">Sistem genel görünümü / System overview</title>
<desc id="d">CSV girdisi, girdi sözleşmesi, SQLite, altı modül ve CLI/REST/panel; altta modülleri araç olarak kullanan ajan orkestratörü. CSV input, input contract, SQLite, six modules and CLI/REST/panel; below, the agent orchestrator that uses the modules as tools.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4e52"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="439" rx="8" fill="#fbfaf6" stroke="#d8d3c7"/>
<text x="24" y="34" font-size="18" font-weight="700" fill="#1b1d1f">Kule Pro + ajan orkestratörü · Kule Pro + agent orchestrator</text>
<text x="24" y="56" font-size="12.5" fill="#4a4e52">Yalnız Python standart kütüphanesi · Python standard library only · veri sentetik / herkese açık · data is synthetic / public</text>

<g font-size="13" fill="#1b1d1f">
<rect x="20" y="86" width="165" height="104" rx="6" fill="#fff" stroke="#1b1d1f"/>
<text x="32" y="110" font-weight="700">CSV girdisi</text><text x="32" y="127" fill="#4a4e52">CSV input</text>
<text x="32" y="152" font-size="12" fill="#4a4e52">SAP tarzı dışa aktarım</text><text x="32" y="168" font-size="12" fill="#4a4e52">SAP-style export (dosya)</text>

<rect x="210" y="86" width="165" height="104" rx="6" fill="#fff" stroke="#1b1d1f"/>
<text x="222" y="110" font-weight="700">Girdi sözleşmesi</text><text x="222" y="127" fill="#4a4e52">Input contract</text>
<text x="222" y="152" font-size="12" fill="#4a4e52">tür, zorunluluk, tekrar</text><text x="222" y="168" font-size="12" fill="#4a4e52">bozuk satır reddedilir</text>

<rect x="400" y="86" width="165" height="104" rx="6" fill="#fff" stroke="#1b1d1f"/>
<text x="412" y="110" font-weight="700">SQLite</text><text x="412" y="127" fill="#4a4e52">history · cases</text>
<text x="412" y="152" font-size="12" fill="#4a4e52">yüklemeler, görüntüler,</text><text x="412" y="168" font-size="12" fill="#4a4e52">vakalar (denetim izi)</text>

<rect x="590" y="86" width="165" height="104" rx="6" fill="#fff" stroke="#1b1d1f"/>
<text x="602" y="110" font-weight="700">6 modül + açıklama</text><text x="602" y="127" fill="#4a4e52">6 modules + explanation</text>
<text x="602" y="152" font-size="12" fill="#4a4e52">kural tabanlı, LLM yok</text><text x="602" y="168" font-size="12" fill="#4a4e52">rule-based, no LLM</text>

<rect x="780" y="86" width="160" height="104" rx="6" fill="#fff" stroke="#1b1d1f"/>
<text x="792" y="110" font-weight="700">CLI · REST · Panel</text><text x="792" y="127" fill="#4a4e52">jetonlu rol matrisi</text>
<text x="792" y="152" font-size="12" fill="#4a4e52">token + role matrix</text><text x="792" y="168" font-size="12" fill="#4a4e52">demo kurulum</text>
</g>
<g stroke="#4a4e52" stroke-width="1.6" marker-end="url(#a)" fill="none">
<path d="M186 138H208"/><path d="M376 138H398"/><path d="M566 138H588"/><path d="M756 138H778"/>
</g>

<g font-size="12" fill="#4a4e52">
<text x="775" y="312" font-weight="700" fill="#1b1d1f">Modüller / Modules</text>
<text x="775" y="332">stok_durumu</text><text x="775" y="348">siparis_anomali</text><text x="775" y="364">talep_tahmini</text>
<text x="775" y="380">tedarikci_skoru</text><text x="775" y="396">uclu_eslestirme · oee</text>
